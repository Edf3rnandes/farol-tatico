<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0e1116">
<title>Farol Tático</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='20' r='9' fill='%23f2b544'/%3E%3Cpath d='M14 58 L26 26 L38 26 L50 58 Z' fill='%234aa8ff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --card2:#1c232c; --line:#2a323d;
    --tx:#e6edf3; --tx2:#9aa7b4; --tx3:#6e7d8c;
    --a:#4aa8ff; --a-dark:#2f7fd6; --b:#f2b544; --c:#57d38c; --d:#e0685f;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --card:#fff; --card2:#f0f2f5; --line:#dde1e7;
           --tx:#12161c; --tx2:#525d6b; --tx3:#7b8794;
           --a:#0b6bcb; --a-dark:#084e94; --b:#a1701a; --c:#1f7a4d; --d:#b03a30; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  #app{min-height:100vh;display:flex;flex-direction:column}

  /* ---------- topo ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;
          border-bottom:1px solid var(--line);position:sticky;top:0;
          background:var(--bg);z-index:10}
  .topbar .logo{display:flex;align-items:center;gap:9px;font-weight:700;
                font-size:1.05rem;letter-spacing:-.01em}
  .topbar .logo svg{width:22px;height:22px;flex:none}
  .topbar .spacer{flex:1}
  .topbar .user{font-size:.8rem;color:var(--tx2);margin-right:4px}
  .topnav{display:flex;gap:2px;background:var(--card2);border-radius:9px;padding:3px;margin-left:6px}
  .topnav button{border:none;background:transparent;color:var(--tx2);padding:6px 13px;
                 border-radius:7px;font-size:.83rem;font-weight:700;cursor:pointer}
  .topnav button.on{background:var(--card);color:var(--tx)}
  .subnav{display:flex;gap:8px;margin-bottom:18px}
  .subnav button{border:1px solid var(--line);background:var(--card);color:var(--tx2);
                 padding:7px 14px;border-radius:999px;font-size:.83rem;font-weight:700;cursor:pointer}
  .subnav button.on{background:var(--a);border-color:var(--a);color:#fff}

  /* ---------- botões ---------- */
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);
       color:var(--tx);border-radius:9px;padding:9px 14px;font-size:.88rem;
       font-weight:600;cursor:pointer;display:inline-flex;align-items:center;
       gap:6px;transition:background .12s}
  .btn:hover{background:var(--card2)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-primary{background:var(--a);border-color:var(--a);color:#fff}
  .btn-primary:hover{background:var(--a-dark)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--tx2)}
  .btn-ghost:hover{background:var(--card2);color:var(--tx)}
  .btn-sm{padding:6px 10px;font-size:.8rem;border-radius:7px}

  /* ---------- layout geral ---------- */
  .main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .center-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:1.02rem;margin:0 0 2px}
  .muted{color:var(--tx2);font-size:.87rem;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:20px}
  .section{margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
  .section:first-of-type{margin-top:6px;padding-top:0;border-top:none}
  .section-title{font-size:.76rem;font-weight:700;text-transform:uppercase;
                 letter-spacing:.06em;color:var(--tx3);margin:0 0 12px}

  /* ---------- formulário ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.79rem;color:var(--tx2);margin-bottom:5px;
               font-weight:600}
  .field input, .field select, .field textarea{
    width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--tx);border-radius:9px;padding:10px 12px;font-size:.92rem;
    font-family:inherit}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--a);outline-offset:-1px}
  .field textarea{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:520px){.row2,.row3{grid-template-columns:1fr}}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);
              background:var(--card2);color:var(--tx2);font-weight:700;
              font-size:.85rem;cursor:pointer}
  .seg button.on{background:var(--a);border-color:var(--a);color:#fff}

  /* ---------- lista ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar input, .toolbar select{background:var(--card);border:1px solid var(--line);
    color:var(--tx);border-radius:9px;padding:9px 12px;font-size:.87rem}
  .toolbar input{flex:1;min-width:160px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
     color:var(--tx3);padding:0 12px 8px;font-weight:600}
  td{padding:12px;background:var(--card);border-top:1px solid var(--line)}
  tr.row td:first-child{border-radius:10px 0 0 10px}
  tr.row td:last-child{border-radius:0 10px 10px 0}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--card2)}
  .nome-cel{font-weight:700}
  .sub-cel{color:var(--tx3);font-size:.78rem}
  .chev{color:var(--tx3);text-align:right}
  .empty{padding:50px 20px;text-align:center;color:var(--tx2)}

  .badge{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;
         padding:3px 9px;border-radius:999px}
  .badge-ativo{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  .badge-inativo{background:color-mix(in srgb,var(--tx3) 20%,transparent);color:var(--tx3)}
  .badge-afastado{background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}

  /* ---------- ficha ---------- */
  .ficha-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--card2);
          border:1px solid var(--line);display:flex;align-items:center;
          justify-content:center;font-weight:700;font-size:1.1rem;color:var(--a);
          flex:none}
  .ficha-actions{display:flex;gap:8px;margin-top:24px;padding-top:18px;
                 border-top:1px solid var(--line)}
  .link-box{display:flex;align-items:center;gap:10px;background:var(--card2);
            border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .link-box code{flex:1;overflow-x:auto;white-space:nowrap;font-size:.78rem;color:var(--tx2)}

  /* ---------- turmas e sessões ---------- */
  .list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;
             padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .list-item:hover{background:var(--card2)}
  .list-item .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .list-item .titulo{font-weight:700}
  .list-item .meta{color:var(--tx3);font-size:.78rem;margin-top:3px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;
        padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--tx2)}
  .dias-semana{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .dias-semana button{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);
                      background:var(--card2);color:var(--tx2);font-size:.78rem;font-weight:700;cursor:pointer}
  .dias-semana button.on{background:var(--a);border-color:var(--a);color:#fff}
  .membro-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .membro-row:last-child{border-bottom:none}
  .membro-row .nome{flex:1;font-size:.9rem}
  .checkbox-big{width:22px;height:22px;flex:none;cursor:pointer;accent-color:var(--a)}
  .presenca-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .presenca-row:last-child{border-bottom:none}
  .presenca-row .nome{flex:1;font-weight:600;font-size:.9rem}
  .status-seg{display:flex;gap:4px}
  .status-seg button{padding:5px 9px;border-radius:7px;border:1px solid var(--line);
                     background:var(--card2);color:var(--tx3);font-size:.72rem;font-weight:700;cursor:pointer}
  .status-seg button.on-presente{background:var(--c);border-color:var(--c);color:#fff}
  .status-seg button.on-ausente{background:var(--d);border-color:var(--d);color:#fff}
  .status-seg button.on-justificado{background:var(--b);border-color:var(--b);color:#fff}
  .status-seg button.on-parcial{background:var(--a);border-color:var(--a);color:#fff}
  .pse-badge{font-size:.74rem;font-weight:700;color:var(--tx3);min-width:64px;text-align:right}
  .pse-badge.respondido{color:var(--c)}

  /* ---------- toast / erro ---------- */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:var(--card);border:1px solid var(--line);color:var(--tx);
         padding:11px 18px;border-radius:10px;font-size:.86rem;box-shadow:0 8px 24px rgba(0,0,0,.25);
         z-index:50;max-width:90vw}
  .toast.err{border-color:var(--d);color:var(--d)}
  .toast.ok{border-color:var(--c);color:var(--c)}

  .box{max-width:380px;width:100%}
  .tabs{display:flex;gap:4px;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:18px}
  .tabs button{flex:1;padding:8px;border:none;background:transparent;color:var(--tx2);
               border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--tx)}
  code.sql{display:block;background:var(--card2);border:1px solid var(--line);
           border-radius:10px;padding:14px;font-size:.78rem;line-height:1.6;
           white-space:pre-wrap;word-break:break-word;color:var(--tx2);margin:14px 0}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);
           border-top-color:var(--a);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- scout ao vivo ---------- */
  .scout-lado{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .scout-lado-btn{padding:26px 10px;border-radius:14px;border:none;font-size:1.1rem;font-weight:800;
                  letter-spacing:.02em;cursor:pointer;color:#fff;transition:transform .08s}
  .scout-lado-btn.nos{background:var(--c)}
  .scout-lado-btn.eles{background:var(--d)}
  .scout-lado-btn:disabled{opacity:.5}
  .scout-lado-btn:active{transform:scale(.97)}
  .scout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .scout-btn{padding:16px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
             color:var(--tx);font-weight:700;font-size:.86rem;cursor:pointer;line-height:1.4}
  .scout-btn span{font-weight:600;color:var(--tx2);font-size:.78rem}
  .scout-btn:disabled{opacity:.5}
  .scout-btn:active{transform:scale(.97)}
  .placar-set{font-size:2.6rem;font-weight:800;letter-spacing:-.02em}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   FAROL TÁTICO — v1
   App de página única, sem etapa de build, falando direto com o Supabase.
   ===================================================================== */

const SUPABASE_URL = 'https://gtygargcfbayfbgontus.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-5pYhC2C1QS3X6HysBHzLg_L6g9TWWs';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  db: { schema: 'ft' }
});

const app = document.getElementById('app');

/* ---------------------------- estado ---------------------------- */
let state = {
  view: 'loading',      // loading | auth | bootstrap | dashboard | lista | ficha | turmas | turma-edit | sessoes | sessao-detail
  aba: 'inicio',         // inicio | atletas | treinos — controla os botões de navegação do topo
  user: null,           // usuário autenticado (auth.users)
  usuario: null,        // linha em ft.usuarios (papel, etc.)
  categorias: [],
  atletas: [],
  filtro: { busca: '', categoria: '', status: 'ativo', turma: '' },
  dashboardAniversariantesAberto: false, // painel de aniversariantes do Início vem fechado por padrão
  fichaId: null,        // null = criando; senão, id do atleta em edição
  fichaOriginal: null,
  fichaToken: undefined, // link do atleta: undefined = não buscou ainda, null = não tem, string = token
  importAtletas: null,   // { linhas: [{dados, erros, avisos, incluir}], arquivoNome } — importação em massa
  revisaoSelecionados: null, // Set de ids de atleta marcados pra aplicar a categoria sugerida por idade
  authTab: 'entrar',
  authErro: '',
  authCarregando: false,

  // treinos
  turmasCarregadas: false,
  turmas: [],
  turmaEdit: null,          // objeto em edição (novo ou existente)
  turmaMembrosIds: new Set(),
  buscaMembroTurma: '',
  turmaAtletasCarregado: false,
  turmaAtletasMap: {},      // atleta_id -> [turma_id, ...] (só matrículas ativas, ate is null) — usado pro filtro de turma em Atletas

  sessoesCarregadas: false,
  sessoes: [],
  sessaoEdit: null,         // form de nova sessão
  sessaoGerar: null,        // form de geração de sessões pré-agendadas (a partir dos dias fixos da turma)
  sessaoAtual: null,        // sessão aberta (detalhe), com presenças carregadas

  // testes físicos
  testesCarregados: false,
  testes: [],                // catálogo ft.testes (CMJ, sprint, Yo-Yo etc.), já vem seedado no banco
  resultadosTestesCarregados: false,
  resultadosTestes: [],      // resultados recentes pra tela de lista/filtro
  filtroTestes: { atletaId: '', testeId: '' },
  testeBateriaForm: null,    // { teste_id, data, bateria, avaliador, condicoes, busca, valores: {atletaId: string} }
  fichaResultadosTestes: undefined, // resultados do atleta da ficha aberta: undefined = carregando, [] = nenhum

  // jogos / scout
  competicoesCarregadas: false,
  competicoes: [],
  subtipos: null,           // vocabulário do scout (ft.subtipos_acao), carregado uma vez
  eventoAtualId: null,      // id da competição (evento) aberta
  eventoAtual: null,        // { competicao, duplas (com resultados_competicao embutido), jogos }
  novoEvento: null,         // form de novo evento
  novaDupla: null,          // form de nova dupla ("time"), cadastrada antes do jogo
  novoJogo: null,           // form de novo jogo
  jogoAtual: null,          // jogo aberto na tela de scout, com sets e rallies carregados

  // estatísticas
  estatisticasCarregadas: false,
  estatisticas: { rallies: [], jogos: [] },
  statsAtletaId: '',        // '' = comparação entre todos; senão, id do atleta selecionado
  statsFiltroAtletaIds: new Set(), // vazio = compara todo mundo; senão, só os marcados aqui
  statsFiltroAberto: false,

  // sincronização do scout offline
  filaSync: [],             // operações pendentes de gravar no Supabase, carregado do localStorage
  sincronizando: false,
};

function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}

function toast(msg, tipo){
  const el = document.createElement('div');
  el.className = 'toast' + (tipo ? ' ' + tipo : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function calcIdade(dataNasc){
  if (!dataNasc) return null;
  const hoje = new Date();
  const nasc = new Date(dataNasc + 'T00:00:00');
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const m = hoje.getMonth() - nasc.getMonth();
  if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade;
}

// Idade "de categoria", pelo critério da federação: quantos anos o atleta
// completa NESTE ano civil, não a idade exata de hoje. Um atleta que nasceu
// em dezembro de 2012 já conta como "13 em 2026" desde 1º de janeiro.
function idadeCategoria(dataNasc){
  if (!dataNasc) return null;
  const anoNascimento = Number(String(dataNasc).slice(0, 4));
  if (!anoNascimento) return null;
  return new Date().getFullYear() - anoNascimento;
}

// Acha, entre as categorias já cadastradas (com idade_min/idade_max), a que
// bate com o sexo e a idade de categoria do atleta neste ano.
function categoriaSugerida(atleta){
  if (!atleta || !atleta.sexo || !atleta.data_nascimento) return null;
  const idade = idadeCategoria(atleta.data_nascimento);
  if (idade === null) return null;
  return state.categorias.find(c => c.sexo === atleta.sexo &&
    (c.idade_min == null || idade >= c.idade_min) &&
    (c.idade_max == null || idade <= c.idade_max)) || null;
}

// Todo mundo com sexo + nascimento cadastrados cuja categoria sugerida pela
// idade não bate com a categoria atual — a lista que alimenta a revisão em massa.
function categoriasParaRevisar(){
  return state.atletas
    .map(a => ({ atleta: a, sugestao: categoriaSugerida(a) }))
    .filter(x => x.sugestao && x.sugestao.id !== x.atleta.categoria_id);
}

/* ---------------------------- dashboard (Início) ---------------------------- */

// Próximo aniversário de cada atleta (ano que vem, se já passou este ano),
// ordenado por quem faz aniversário primeiro. dias = janela de quantos dias
// pra frente considerar "próximo".
function aniversariantesProximos(dias = 30){
  const hoje = new Date();
  const hojeSemHora = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());

  return state.atletas
    .filter(a => a.data_nascimento)
    .map(a => {
      const nasc = new Date(a.data_nascimento + 'T00:00:00');
      let proxima = new Date(hojeSemHora.getFullYear(), nasc.getMonth(), nasc.getDate());
      if (proxima < hojeSemHora) proxima = new Date(hojeSemHora.getFullYear() + 1, nasc.getMonth(), nasc.getDate());
      const diffDias = Math.round((proxima - hojeSemHora) / 86400000);
      const idadeQueFaz = proxima.getFullYear() - nasc.getFullYear();
      return { atleta: a, proxima, diffDias, idadeQueFaz };
    })
    .filter(x => x.diffDias >= 0 && x.diffDias <= dias)
    .sort((a, b) => a.diffDias - b.diffDias);
}

// Aniversariantes do MÊS atual (em vez de "próximos N dias"), ordenados pelo
// dia do mês — inclui quem já fez aniversário este mês, não só quem ainda
// vai fazer, pra bater com "quem faz aniversário em [mês]" no calendário.
function aniversariantesDoMes(){
  const hoje = new Date();
  const mesAtual = hoje.getMonth();
  const anoAtual = hoje.getFullYear();

  return state.atletas
    .filter(a => a.data_nascimento)
    .map(a => {
      const nasc = new Date(a.data_nascimento + 'T00:00:00');
      const dataEsteAno = new Date(anoAtual, nasc.getMonth(), nasc.getDate());
      const idadeQueFaz = anoAtual - nasc.getFullYear();
      return { atleta: a, proxima: dataEsteAno, idadeQueFaz, dia: nasc.getDate() };
    })
    .filter(x => x.proxima.getMonth() === mesAtual)
    .sort((a, b) => a.dia - b.dia);
}

function descricaoDiasRestantes(diffDias){
  if (diffDias === 0) return 'hoje';
  if (diffDias === 1) return 'amanhã';
  return `em ${diffDias} dias`;
}

function proximosEventos(limite = 5){
  const hoje = new Date().toISOString().slice(0, 10);
  return state.competicoes
    .filter(c => (c.data_fim || c.data_inicio) >= hoje)
    .sort((a, b) => a.data_inicio.localeCompare(b.data_inicio))
    .slice(0, limite);
}

function proximasSessoes(limite = 5){
  const hoje = new Date().toISOString().slice(0, 10);
  return state.sessoes
    .filter(s => s.data >= hoje)
    .sort((a, b) => a.data.localeCompare(b.data) || (a.hora_inicio || '').localeCompare(b.hora_inicio || ''))
    .slice(0, limite);
}

// Atalhos rápidos a partir do dashboard: além de abrir a tela, ajustam a aba
// ativa pra navegação/voltar continuarem consistentes.
function novoAtletaDoDashboard(){ marcarAba('atletas'); abrirNovaFicha(); }
function novaSessaoDoDashboard(){ marcarAba('treinos'); abrirNovaSessao(); }
function novoEventoDoDashboard(){ marcarAba('jogos'); abrirNovoEvento(); }

// Os cards de "X ativos" só mostravam o número — pra ver QUEM são, tinha que
// sair procurando na aba de Atletas/Treinos na mão. Clicar no card já leva
// direto pra lista certa, filtrada.
function verAtletasAtivosDoDashboard(){
  marcarAba('atletas');
  state.filtro = { busca: '', categoria: '', status: 'ativo', turma: '' };
  state.view = 'lista';

function iniciais(nome){
  if (!nome) return '?';
  const partes = nome.trim().split(/\s+/);
  const a = partes[0]?.[0] || '';
  const b = partes.length > 1 ? partes[partes.length - 1][0] : '';
  return (a + b).toUpperCase();
}

/* ---------------------------- scout offline ----------------------------
   O scout ao vivo (marcar pontos jogo a jogo) precisa continuar funcionando
   em quadra de praia com sinal ruim ou nenhum. A estratégia: toda gravação
   feita na tela de scout (ponto marcado, desfazer, fim de set/jogo) atualiza
   o estado local NA HORA e só DEPOIS tenta gravar no Supabase — se não
   conseguir, a operação fica numa fila salva no aparelho e o jogo continua
   normalmente. A fila tenta sincronizar sozinha quando a conexão volta, e
   também dá pra forçar com o botão "Sincronizar agora".
   Isso vale só a partir do momento em que a tela de scout já foi aberta com
   sinal pelo menos uma vez — criar um jogo novo ainda precisa de conexão.
--------------------------------------------------------------------------- */

function novoUuid(){
  if (window.crypto?.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function carregarFilaSyncDoStorage(){
  try { return JSON.parse(localStorage.getItem('ft_fila_sync') || '[]'); }
  catch { return []; }
}

function salvarFilaSyncNoStorage(fila){
  try { localStorage.setItem('ft_fila_sync', JSON.stringify(fila)); } catch {}
}

function enfileirarOperacao(tabela, tipo, alvoId, dados){
  state.filaSync.push({ id: novoUuid(), tabela, tipo, alvoId, dados, criadoEm: new Date().toISOString() });
  salvarFilaSyncNoStorage(state.filaSync);
}

async function executarOperacaoSync(op){
  try {
    let resp;
    if (op.tipo === 'insert') resp = await sb.from(op.tabela).insert(op.dados);
    else if (op.tipo === 'update') resp = await sb.from(op.tabela).update(op.dados).eq('id', op.alvoId);
    else if (op.tipo === 'delete') resp = await sb.from(op.tabela).delete().eq('id', op.alvoId);
    if (resp?.error){
      // O supabase-js NÃO lança exceção quando o fetch falha por falta de rede —
      // ele devolve isso como se fosse um erro comum, só que sem "code" (o code
      // só vem preenchido quando o pedido realmente chegou no Postgres/PostgREST).
      // Sem essa distinção, uma queda de sinal seria tratada como erro definitivo
      // e o ponto seria descartado da fila em vez de tentado de novo depois.
      const semRespostaDoServidor = !resp.error.code;
      return semRespostaDoServidor
        ? { status: 'falha-rede', mensagem: resp.error.message }
        : { status: 'erro-servidor', mensagem: resp.error.message };
    }
    return { status: 'ok' };
  } catch (e) {
    return { status: 'falha-rede', mensagem: e?.message || 'sem conexão' };
  }
}

// Processa a fila em ordem (importante: um ponto pode ter sido desfeito antes
// mesmo de terminar de sincronizar — a ordem garante que o resultado final
// bate). Falha de rede para tudo e tenta de novo depois; erro real do
// servidor descarta só aquela operação (não pode travar a fila pra sempre).
async function processarFilaSync(){
  if (state.sincronizando || !state.filaSync.length) return;
  state.sincronizando = true;
  if (state.view === 'jogo-scout') render();

  while (state.filaSync.length){
    const resultado = await executarOperacaoSync(state.filaSync[0]);
    if (resultado.status === 'falha-rede') break;
    if (resultado.status === 'erro-servidor'){
      console.error('Sync: operação rejeitada, descartada da fila —', state.filaSync[0], resultado.mensagem);
      toast('Um dado do scout não pôde ser sincronizado — confira esse jogo com calma depois.', 'err');
    }
    state.filaSync.shift();
    salvarFilaSyncNoStorage(state.filaSync);
  }

  state.sincronizando = false;
  if (state.view === 'jogo-scout') render();
}

function persistirJogoAtualOffline(){
  try {
    const ja = state.jogoAtual;
    if (!ja || ja.carregando) return;
    localStorage.setItem('ft_scout_offline', JSON.stringify({ jogoId: ja.jogo.id, jogoAtual: ja }));
  } catch {}
}

function carregarJogoAtualOffline(jogoId){
  try {
    const raw = localStorage.getItem('ft_scout_offline');
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return obj.jogoId === jogoId ? obj.jogoAtual : null;
  } catch { return null; }
}

/* ---------------------------- boot ---------------------------- */

async function init(){
  state.filaSync = carregarFilaSyncDoStorage();

  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user || null;

  sb.auth.onAuthStateChange((_evt, session) => {
    state.user = session?.user || null;
    boot();
  });

  await boot();

  if (state.filaSync.length) processarFilaSync();
  window.addEventListener('online', () => processarFilaSync());
  setInterval(() => { if (state.filaSync.length) processarFilaSync(); }, 20000);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
}

async function boot(){
  if (!state.user){
    state.view = 'auth';
    render();
    return;
  }

  const { data: usuario, error } = await sb
    .from('usuarios')
    .select('*')
    .eq('id', state.user.id)
    .maybeSingle();

  if (error){
    console.error(error);
    toast('Erro ao verificar seu acesso: ' + error.message, 'err');
  }

  state.usuario = usuario || null;

  if (!state.usuario || !state.usuario.ativo){
    state.view = 'bootstrap';
    render();
    return;
  }

  await Promise.all([
    carregarCategorias(), carregarAtletas(), carregarTurmas(), carregarTurmaAtletasMap(),
    carregarCompeticoes(), carregarSessoes(),
  ]);

  // Sempre que o navegador recarrega a página (trocar de app no celular, PWA
  // reiniciada em segundo plano etc.) o estado da tela se perde — sem isto,
  // a pessoa sempre volta pro Início mesmo saindo de outra aba. Guarda a
  // última aba usada e volta direto pra ela.
  const VIEW_PADRAO_DA_ABA = { inicio: 'dashboard', atletas: 'lista', jogos: 'eventos', estatisticas: 'estatisticas', treinos: 'sessoes' };
  let ultimaAba = 'inicio';
  try { ultimaAba = localStorage.getItem('ft_ultima_aba') || 'inicio'; } catch {}
  if (!VIEW_PADRAO_DA_ABA[ultimaAba]) ultimaAba = 'inicio';

  state.aba = ultimaAba;
  state.view = VIEW_PADRAO_DA_ABA[ultimaAba];
  render();

  if (ultimaAba === 'jogos' && !state.competicoesCarregadas) await carregarCompeticoes();
  if (ultimaAba === 'estatisticas' && !state.estatisticasCarregadas) await carregarEstatisticas();
  if (ultimaAba === 'treinos' && !state.turmasCarregadas) await carregarTurmas();
  render();
}

// Mapa atleta_id -> [turma_id, ...] das matrículas ativas (ate is null), pra
// filtrar/mostrar grupo de treino na tela de Atletas sem uma query por atleta.
async function carregarTurmaAtletasMap(){

    mapa[r.atleta_id].push(r.turma_id);

async function handleAuthSubmit(ev){
  ev.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const senha = document.getElementById('auth-senha').value;

  if (!email || !senha){
    state.authErro = 'Preencha e-mail e senha.';
    render();
    return;
  }

  state.authCarregando = true;
  state.authErro = '';
  render();

  const fn = state.authTab === 'entrar' ? 'signInWithPassword' : 'signUp';
  const { data, error } = await sb.auth[fn]({ email, password: senha });

  state.authCarregando = false;

  if (error){
    state.authErro = traduzErroAuth(error.message);
    render();
    return;
  }

  if (state.authTab === 'criar' && !data.session){
    state.authErro = '';
    toast('Conta criada. Confira seu e-mail para confirmar o acesso, se for solicitado.', 'ok');
    render();
    return;
  }

  state.user = data.user;
  await boot();
}

function traduzErroAuth(msg){
  if (/already registered/i.test(msg)) return 'Este e-mail já tem conta — tente entrar em vez de criar.';
  if (/invalid login/i.test(msg))     return 'E-mail ou senha incorretos.';
  if (/password.*(6|weak)/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  return msg;
}

const CAMPOS_VAZIOS = {
  nome: '', apelido: '', sexo: '', categoria_id: '', data_nascimento: '',
  altura_cm: '', peso_kg: '', envergadura_cm: '', alcance_ataque_cm: '', alcance_bloqueio_cm: '',
  mao_dominante: '', lado_preferencial: '', telefone: '', instagram: '', email: '',
  responsavel_nome: '', responsavel_telefone: '', status: 'ativo', observacoes: ''
};

function abrirNovaFicha(){
  state.fichaId = null;
  state.fichaOriginal = { ...CAMPOS_VAZIOS };
  state.fichaToken = null; // atleta novo ainda não tem link — só existe depois de salvar
  state.fichaResultadosTestes = [];
  state.view = 'ficha';
  render();
}

async function abrirFicha(id){
  const at = state.atletas.find(a => a.id === id);
  if (!at) return;
  state.fichaId = id;
  state.fichaOriginal = { ...CAMPOS_VAZIOS, ...at };
  state.fichaToken = undefined; // undefined = buscando
  state.fichaResultadosTestes = undefined; // undefined = buscando
  state.view = 'ficha';
  render();

  const [tokenResp, testesResp] = await Promise.all([
    sb.from('tokens_atleta').select('token').eq('atleta_id', id).eq('revogado', false).limit(1).maybeSingle(),
    sb.from('resultados_testes').select('*, testes(nome, unidade, direcao)').eq('atleta_id', id)
      .order('data', { ascending: false }).limit(20),
    state.estatisticasCarregadas ? Promise.resolve() : carregarEstatisticas(),
  ]);

  if (tokenResp.error){ console.error(tokenResp.error); state.fichaToken = null; }
  else state.fichaToken = tokenResp.data?.token || null;

  if (testesResp?.error){ console.error(testesResp.error); state.fichaResultadosTestes = []; }
  else state.fichaResultadosTestes = testesResp?.data || [];

  render();
}

function linkDoAtleta(token){
  return new URL('atleta.html?t=' + encodeURIComponent(token), location.href).toString();
}

async function copiarLinkAtleta(){
  if (!state.fichaToken) return;
  const link = linkDoAtleta(state.fichaToken);
  try {
    await navigator.clipboard.writeText(link);
    toast('Link copiado.', 'ok');
  } catch {
    toast(link); // navegador sem permissão de clipboard: mostra o link pra copiar na mão
  }
}

function voltarParaLista(){
  state.view = 'lista';
  state.fichaId = null;
  render();
}

function lerFormFicha(){
  const g = (id) => document.getElementById(id)?.value?.trim() ?? '';
  const num = (v) => v === '' ? null : Number(v);
  return {
    nome: g('f-nome'),
    apelido: g('f-apelido') || null,
    sexo: state.fichaOriginal.sexo,
    categoria_id: g('f-categoria') ? Number(g('f-categoria')) : null,
    data_nascimento: g('f-nascimento') || null,
    altura_cm: num(g('f-altura')),
    peso_kg: num(g('f-peso')),
    envergadura_cm: num(g('f-envergadura')),
    alcance_ataque_cm: num(g('f-alcance-at')),
    alcance_bloqueio_cm: num(g('f-alcance-bl')),
    mao_dominante: g('f-mao') || null,
    lado_preferencial: g('f-lado') || null,
    telefone: g('f-telefone') || null,
    instagram: g('f-instagram') || null,
    email: g('f-email') || null,
    responsavel_nome: g('f-resp-nome') || null,
    responsavel_telefone: g('f-resp-tel') || null,
    status: state.fichaOriginal.status,
    observacoes: g('f-obs') || null,
  };
}

// O render() reconstrói a ficha inteira a partir de state.fichaOriginal.
// Sem isto, clicar em Sexo ou Status depois de já ter digitado nome,
// telefone etc. apagaria tudo que foi digitado — porque o HTML novo viria
// do estado antigo, não do que está na tela no momento do clique.
function sincronizarFichaDoDom(){
  const f = state.fichaOriginal;
  const g = (id) => document.getElementById(id);
  const ids = {
    nome: 'f-nome', apelido: 'f-apelido', data_nascimento: 'f-nascimento',
    categoria_id: 'f-categoria', altura_cm: 'f-altura', peso_kg: 'f-peso', envergadura_cm: 'f-envergadura',
    alcance_ataque_cm: 'f-alcance-at', alcance_bloqueio_cm: 'f-alcance-bl',
    mao_dominante: 'f-mao', lado_preferencial: 'f-lado', telefone: 'f-telefone',
    instagram: 'f-instagram',
    email: 'f-email', responsavel_nome: 'f-resp-nome', responsavel_telefone: 'f-resp-tel',
    observacoes: 'f-obs',
  };
  for (const campo in ids){
    const el = g(ids[campo]);
    if (el) f[campo] = el.value;
  }
}

function setSexoFicha(sexo){
  sincronizarFichaDoDom();
  state.fichaOriginal.sexo = sexo;
  state.fichaOriginal.categoria_id = ''; // categoria depende do sexo, reseta
  render();
}

function setStatusFicha(status){

  render();
}

async function salvarFicha(ev){
  ev.preventDefault();
  const dados = lerFormFicha();

  if (!dados.nome){ toast('O nome é obrigatório.', 'err'); return; }
  if (!dados.sexo){ toast('Selecione o sexo do atleta.', 'err'); return; }

  const btn = document.getElementById('btn-salvar-ficha');
  if (btn){ btn.disabled = true; btn.textContent = 'Salvando…'; }

  const eraNovo = !state.fichaId;
  let resp;
  if (state.fichaId){
    resp = await sb.from('atletas').update(dados).eq('id', state.fichaId);
  } else {
    resp = await sb.from('atletas').insert(dados).select().single();
  }

  if (resp.error){
    toast('Não foi possível salvar: ' + resp.error.message, 'err');
    if (btn){ btn.disabled = false; btn.textContent = 'Salvar'; }
    return;
  }

  await carregarAtletas();

  // Atleta novo: reabre a ficha dele já mostrando o link — não faz o cadastro
  // completo sozinho, quem termina é o próprio atleta pelo link, sem o Ed
  // ter que digitar telefone/altura etc. na mão.
  if (eraNovo && resp.data?.id){
    toast('Atleta salvo! Copia o link aí embaixo e manda pra ele completar o cadastro dele (telefone, altura, contato do responsável...).', 'ok');
    await abrirFicha(resp.data.id);
  } else {
    toast('Atleta salvo.', 'ok');
    voltarParaLista();
  }
}

// Exclusão real do cadastro. Duplas e rallies referenciam o atleta sem cascata
// (de propósito — não queremos apagar histórico de jogo sozinho), então um
// atleta com jogos registrados não pode ser excluído; nesse caso oferecemos
// marcar como Inativo em vez disso, que já tira ele das listas e filtros padrão.
async function excluirAtleta(){
  if (!state.fichaId) return;
  const nome = state.fichaOriginal?.nome || 'este atleta';
  if (!confirm(`Excluir ${nome} definitivamente?\n\nIsso apaga o cadastro e não pode ser desfeito.`)) return;

  const btn = document.getElementById('btn-excluir-ficha');
  if (btn){ btn.disabled = true; btn.textContent = 'Excluindo…'; }

  const resp = await sb.from('atletas').delete().eq('id', state.fichaId);

  if (resp.error){
    if (btn){ btn.disabled = false; btn.textContent = 'Excluir atleta'; }

    if (resp.error.code === '23503'){ // foreign_key_violation
      const marcarInativo = confirm(
        `Não dá pra excluir ${nome}: já tem duplas ou pontos de jogo registrados no histórico dele.\n\n` +
        `Quer marcar como Inativo em vez disso? Mantém o histórico e tira ele da lista de ativos.\n\n` +
        `(Cancelar aqui vai perguntar se você prefere apagar tudo mesmo assim, incluindo os jogos.)`
      );
      if (marcarInativo){
        const respInativo = await sb.from('atletas').update({ status: 'inativo' }).eq('id', state.fichaId);
        if (respInativo.error){ toast('Não foi possível atualizar: ' + respInativo.error.message, 'err'); return; }
        toast('Atleta marcado como inativo.', 'ok');
        await carregarAtletas();
        voltarParaLista();
        return;
      }

      const apagarTudo = confirm(
        `Apagar ${nome} de vez, incluindo as duplas, os jogos e os pontos marcados no histórico dele?\n\n` +
        `Atenção: como os jogos são de dupla, isso também apaga esse(s) jogo(s) pro parceiro (ou parceira) dele nas duplas em que jogaram juntos. Não pode ser desfeito.`
      );
      if (apagarTudo) await excluirAtletaComEstatisticas(state.fichaId, nome);
      return;
    }

    toast('Não foi possível excluir: ' + resp.error.message, 'err');
    return;
  }

  toast('Atleta excluído.', 'ok');
  await carregarAtletas();
  voltarParaLista();
}

// Apaga o atleta "de vez" mesmo já tendo histórico: primeiro apaga as duplas
// em que ele jogou (o "on delete cascade" do banco cuida de sumir com os
// jogos/sets/pontos delas junto), e só depois o cadastro do atleta em si —
// nessa hora o próprio banco cuida em cascata dos testes físicos, avaliações,
// turmas etc. que já eram "on delete cascade" desde o início.
async function excluirAtletaComEstatisticas(atletaId, nome){
  const btn = document.getElementById('btn-excluir-ficha');
  if (btn){ btn.disabled = true; btn.textContent = 'Excluindo…'; }

  const [r1, r2] = await Promise.all([
    sb.from('duplas').select('id').eq('atleta_1_id', atletaId),
    sb.from('duplas').select('id').eq('atleta_2_id', atletaId),
  ]);
  if (r1.error || r2.error){
    if (btn){ btn.disabled = false; btn.textContent = 'Excluir atleta'; }
    toast('Erro ao localizar as duplas dele: ' + (r1.error || r2.error).message, 'err');
    return;
  }
  const duplaIds = [...new Set([...(r1.data || []), ...(r2.data || [])].map(d => d.id))];

  for (const duplaId of duplaIds){
    const respDupla = await sb.from('duplas').delete().eq('id', duplaId);
    if (respDupla.error){
      if (btn){ btn.disabled = false; btn.textContent = 'Excluir atleta'; }
      toast('Erro ao apagar uma das duplas dele: ' + respDupla.error.message, 'err');
      return;
    }
  }

  const respAtleta = await sb.from('atletas').delete().eq('id', atletaId);
  if (respAtleta.error){
    if (btn){ btn.disabled = false; btn.textContent = 'Excluir atleta'; }
    toast('As duplas e os jogos foram apagados, mas não foi possível apagar o cadastro dele: ' + respAtleta.error.message, 'err');
    return;
  }

  toast(`${nome} e todo o histórico de jogos dele foram apagados.`, 'ok');
  await carregarAtletas();
  voltarParaLista();
}

function baixarModeloImportacaoAtletas(){
  const cabecalho = ['Nome completo*','Apelido','Sexo (M/F)*','Categoria','Data de nascimento (AAAA-MM-DD)',
    'Altura (cm)','Envergadura (cm)','Alcance de ataque (cm)','Alcance de bloqueio (cm)',
    'Mão dominante (destro/canhoto)','Lado preferencial (direita/esquerda/ambos)','Telefone','E-mail',
    'Nome do responsável','Telefone do responsável','Status (ativo/inativo/afastado)','Observações'];
  const exemplo = ['Maria Laura Souza','Malu','F','Sub-19','2008-03-15','172','178','210','205',
    'destro','direita','(11) 99999-0000','malu@example.com','','','ativo',''];

  const linhaCsv = (campos) => campos.map(c => {
    const s = String(c ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',');

  const csv = [linhaCsv(cabecalho), linhaCsv(exemplo)].join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'modelo_atletas.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Aceita tanto vírgula quanto ponto-e-vírgula como separador — o Excel em
// português costuma exportar CSV com ponto-e-vírgula.
function detectarDelimitadorCsv(linhaCabecalho){
  const virgulas = (linhaCabecalho.match(/,/g) || []).length;
  const pontoVirgulas = (linhaCabecalho.match(/;/g) || []).length;
  return pontoVirgulas > virgulas ? ';' : ',';
}

function parseCsv(texto){
  const semBom = texto.replace(/^﻿/, '');
  const linhasBrutas = semBom.split(/\r\n|\n|\r/).filter(l => l.trim() !== '');
  if (linhasBrutas.length === 0) return [];
  const delim = detectarDelimitadorCsv(linhasBrutas[0]);

  function parseLinha(linha){
    const campos = [];
    let atual = '', dentroAspas = false;
    for (let i = 0; i < linha.length; i++){
      const c = linha[i];
      if (dentroAspas){
        if (c === '"'){
          if (linha[i+1] === '"'){ atual += '"'; i++; }
          else dentroAspas = false;
        } else atual += c;
      } else {
        if (c === '"') dentroAspas = true;
        else if (c === delim){ campos.push(atual); atual = ''; }
        else atual += c;
      }
    }
    campos.push(atual);
    return campos.map(c => c.trim());
  }

  return linhasBrutas.map(parseLinha);
}

// Assume a mesma ordem de colunas do modelo baixado — mais simples e mais
// robusto pra um usuário colando de uma planilha do que casar por nome de coluna.
function validarLinhaImportacao(campos){
  const [nome, apelido, sexoRaw, categoriaRaw, dataRaw, alturaRaw, envergaduraRaw, alcAtRaw, alcBlRaw,
    maoRaw, ladoRaw, telefone, email, respNome, respTel, statusRaw, obs] = campos;
  const erros = [];
  const avisos = [];

  if (!nome) erros.push('nome é obrigatório');

  let sexo = null;
  const sexoNorm = (sexoRaw || '').trim().toLowerCase();
  if (sexoNorm.startsWith('m')) sexo = 'M';
  else if (sexoNorm.startsWith('f')) sexo = 'F';
  else erros.push('sexo inválido (use M ou F)');

  let categoria_id = null;
  if (categoriaRaw && sexo){
    const cat = state.categorias.find(c => c.sexo === sexo && c.nome.toLowerCase() === categoriaRaw.trim().toLowerCase());
    if (cat) categoria_id = cat.id;
    else avisos.push(`categoria "${categoriaRaw}" não encontrada — deixei em branco`);
  }

  let data_nascimento = null;
  if (dataRaw){
    if (/^\d{4}-\d{2}-\d{2}$/.test(dataRaw)) data_nascimento = dataRaw;
    else {
      const m = dataRaw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) data_nascimento = `${m[3]}-${m[2]}-${m[1]}`;
      else erros.push('data de nascimento inválida (use AAAA-MM-DD ou DD/MM/AAAA)');
    }
  }

  function num(v, label){
    if (!v) return null;
    const n = Number(String(v).replace(',', '.'));
    if (Number.isNaN(n)){ erros.push(label + ' inválido'); return null; }
    return n;
  }
  const altura_cm = num(alturaRaw, 'altura');
  const envergadura_cm = num(envergaduraRaw, 'envergadura');
  const alcance_ataque_cm = num(alcAtRaw, 'alcance de ataque');
  const alcance_bloqueio_cm = num(alcBlRaw, 'alcance de bloqueio');

  let mao_dominante = null;
  const maoNorm = (maoRaw || '').trim().toLowerCase();
  if (maoNorm){
    if (['destro','canhoto'].includes(maoNorm)) mao_dominante = maoNorm;
    else avisos.push('mão dominante não reconhecida — deixei em branco');
  }

  let lado_preferencial = null;
  const ladoNorm = (ladoRaw || '').trim().toLowerCase();
  if (ladoNorm){
    if (['direita','esquerda','ambos'].includes(ladoNorm)) lado_preferencial = ladoNorm;
    else avisos.push('lado preferencial não reconhecido — deixei em branco');
  }

  let status = 'ativo';
  const statusNorm = (statusRaw || '').trim().toLowerCase();
  if (statusNorm){
    if (['ativo','inativo','afastado'].includes(statusNorm)) status = statusNorm;
    else avisos.push(`status "${statusRaw}" não reconhecido — usei "ativo"`);
  }

  return {
    dados: {
      nome: nome || '', apelido: apelido || null, sexo, categoria_id,
      data_nascimento, altura_cm, envergadura_cm, alcance_ataque_cm, alcance_bloqueio_cm,
      mao_dominante, lado_preferencial, telefone: telefone || null, email: email || null,
      responsavel_nome: respNome || null, responsavel_telefone: respTel || null,
      status, observacoes: obs || null,
    },
    erros, avisos,
  };
}

// Só a coluna de sexo (M/F) é confiável o bastante pra distinguir cabeçalho
// de dado real — um título de coluna nunca começa com "m" ou "f" sozinho.
function pareceLinhaDeCabecalho(campos){
  const sexo = (campos[2] || '').trim().toLowerCase();
  return !(sexo.startsWith('m') || sexo.startsWith('f'));
}

function processarTextoImportacao(texto, nomeArquivo){
  let linhas = parseCsv(texto).filter(campos => campos.some(c => c && c.trim() !== ''));
  if (linhas.length && pareceLinhaDeCabecalho(linhas[0])) linhas = linhas.slice(1);

  const processadas = linhas.map(campos => {
    const { dados, erros, avisos } = validarLinhaImportacao(campos);
    return { dados, erros, avisos, incluir: erros.length === 0 };
  });
  if (processadas.length === 0){
    toast('Não encontrei nenhuma linha de atleta nesse arquivo.', 'err');
    return;
  }
  state.importAtletas = { linhas: processadas, arquivoNome: nomeArquivo };
  render();
}

function handleArquivoImportacao(input){
  const arquivo = input.files?.[0];
  if (!arquivo) return;
  const reader = new FileReader();
  reader.onload = (e) => processarTextoImportacao(e.target.result, arquivo.name);
  reader.readAsText(arquivo, 'UTF-8');
}

function processarTextoColadoImportacao(){
  const texto = document.getElementById('import-textarea')?.value || '';
  if (!texto.trim()){ toast('Cole os dados da planilha primeiro.', 'err'); return; }

    return;

  } else {
    resp = await sb.from('turmas').insert(dados).select().single();
  }

// Mantém state.turmaAtletasMap (usado no filtro/coluna de turma em Atletas)
// em sincronia com as mudanças otimistas de membro feitas aqui.
function atualizarTurmaAtletasMapLocal(atletaId, turmaId, adicionar){
  const atual = state.turmaAtletasMap[atletaId] || [];
  state.turmaAtletasMap[atletaId] = adicionar
    ? (atual.includes(turmaId) ? atual : [...atual, turmaId])
    : atual.filter(id => id !== turmaId);

// Toggle otimista: atualiza a tela na hora e só depois confirma no banco.
// Se der erro, desfaz e avisa — melhor que travar o clique esperando a rede.
async function toggleMembroTurma(atletaId){
  const turmaId = state.turmaEdit.id;
  const estava = state.turmaMembrosIds.has(atletaId);

  sincronizarTurmaDoDom();
  estava ? state.turmaMembrosIds.delete(atletaId) : state.turmaMembrosIds.add(atletaId);
  atualizarTurmaAtletasMapLocal(atletaId, turmaId, !estava);
  render();

  const resp = estava
    ? await sb.from('turma_atletas').update({ ate: new Date().toISOString().slice(0,10) })
        .eq('turma_id', turmaId).eq('atleta_id', atletaId).is('ate', null)
    : await sb.from('turma_atletas')
        .upsert({ turma_id: turmaId, atleta_id: atletaId, ate: null, desde: new Date().toISOString().slice(0,10) },
                { onConflict: 'turma_id,atleta_id' });

  if (resp.error){
    toast('Não deu pra atualizar: ' + resp.error.message, 'err');
    estava ? state.turmaMembrosIds.add(atletaId) : state.turmaMembrosIds.delete(atletaId);
    atualizarTurmaAtletasMapLocal(atletaId, turmaId, estava);
    render();
  }
}

   fixos e horário já cadastrados na turma, em vez de criar uma por vez ---- */

const CODIGO_DIA_JS = { dom: 0, seg: 1, ter: 2, qua: 3, qui: 4, sex: 5, sab: 6 };

function abrirGerarSessoes(){
  marcarAba('treinos');
  const hoje = new Date().toISOString().slice(0,10);

function datasParaGerar(){
  const f = state.sessaoGerar;
  const turma = state.turmas.find(t => t.id === f.turma_id);
  if (!turma || !(turma.dias_semana || []).length || !f.data_inicio) return [];
  const diasAlvo = new Set(turma.dias_semana.map(d => CODIGO_DIA_JS[d]));
  const semanas = Number(f.semanas) || 0;
  const totalDias = semanas * 7;
  const inicio = new Date(f.data_inicio + 'T00:00:00');
  const datas = [];
  for (let i = 0; i < totalDias; i++){
    const d = new Date(inicio);
    d.setDate(d.getDate() + i);
    if (diasAlvo.has(d.getDay())) datas.push(d.toISOString().slice(0,10));
  }
  return datas;
}

async function salvarSessoesGeradas(ev){
  ev.preventDefault();
  sincronizarGerarSessoesDoDom();
  const f = state.sessaoGerar;
  const turma = state.turmas.find(t => t.id === f.turma_id);
  if (!turma){ toast('Escolhe a turma.', 'err'); return; }
  const datas = datasParaGerar();
  if (datas.length === 0){ toast('Nenhuma data pra gerar com essas opções.', 'err'); return; }

  // Evita duplicar sessão num dia que a turma já tem marcado. A lista em tela
  // só guarda as sessões mais recentes, então confere direto no banco.
  const { data: existentes, error: eErr } = await sb
    .from('sessoes').select('data').eq('turma_id', turma.id).in('data', datas);
  if (eErr){ toast('Erro ao conferir sessões existentes: ' + eErr.message, 'err'); return; }
  const jaExiste = new Set((existentes || []).map(s => s.data));
  const novasDatas = datas.filter(d => !jaExiste.has(d));
  if (novasDatas.length === 0){ toast('Essa turma já tem sessão marcada em todas essas datas.', 'err'); return; }

  const duracaoPadrao = (turma.horario_inicio && turma.horario_fim)
    ? Math.max(1, Math.round((new Date('1970-01-01T' + turma.horario_fim) - new Date('1970-01-01T' + turma.horario_inicio)) / 60000))
    : 90;
  const linhas = novasDatas.map(data => ({
    data,
    hora_inicio: turma.horario_inicio || null,
    duracao_min: duracaoPadrao,
    tipo: f.tipo,
    turma_id: turma.id,
    local: turma.local || null,
  }));

  const resp = await sb.from('sessoes').insert(linhas);
  if (resp.error){ toast('Não foi possível gerar as sessões: ' + resp.error.message, 'err'); return; }

  const puladas = datas.length - novasDatas.length;
  toast(`${novasDatas.length} sessõe${novasDatas.length===1?'':'s'} criada${novasDatas.length===1?'':'s'}` +
    (puladas > 0 ? ` (${puladas} já existia${puladas===1?'':'m'} e ${puladas===1?'foi pulada':'foram puladas'}).` : '.'), 'ok');
  await carregarSessoes();
  voltarParaSessoes();
}

async function salvarNovaSessao(ev){
  ev.preventDefault();

  if (!s.duracao_min){ toast('Preenche a duração.', 'err'); return; }

    hora_inicio: s.hora_inicio || null,
    duracao_min: Number(s.duracao_min),
    tipo: s.tipo,

    local: s.local || null,

  };

  if (resp.error){ toast('Não foi possível salvar: ' + resp.error.message, 'err'); return; }

async function abrirSessaoDetalhe(id){
  marcarAba('treinos');
  state.view = 'sessao-detail';
  state.sessaoAtual = { id, carregando: true };
  render();

  const [{ data: sessao, error: e1 }, { data: presencas, error: e2 }, { data: pses, error: e3 }] = await Promise.all([
    sb.from('sessoes').select('*, turmas(nome)').eq('id', id).single(),
    sb.from('presencas').select('*, atletas(id, nome, apelido)').eq('sessao_id', id),
    sb.from('pse_sessao').select('atleta_id, pse').eq('sessao_id', id),
  ]);

  if (e1 || e2 || e3){
    toast('Erro ao abrir sessão: ' + (e1||e2||e3).message, 'err');
    return;
  }

  const pseMap = Object.fromEntries((pses || []).map(p => [p.atleta_id, p.pse]));
  state.sessaoAtual = {
    id, sessao,
    presencas: (presencas || [])
      .map(p => ({ ...p, pse: pseMap[p.atleta_id] ?? null }))
      .sort((a,b) => (a.atletas?.nome || '').localeCompare(b.atletas?.nome || '')),
  };
  render();
}

async function atualizarStatusPresenca(presencaId, status){
  // otimista: muda na tela primeiro
  const p = state.sessaoAtual.presencas.find(x => x.id === presencaId);
  if (!p) return;
  const anterior = p.status;
  p.status = status;
  render();

  const resp = await sb.from('presencas').update({ status }).eq('id', presencaId);
  if (resp.error){
    toast('Não deu pra atualizar: ' + resp.error.message, 'err');
    p.status = anterior;
    render();
  }
}

async function adicionarAtletaNaSessao(atletaId){
  if (!atletaId) return;
  const s = state.sessaoAtual;
  if (s.presencas.some(p => p.atleta_id === atletaId)) return;

  const resp = await sb.from('presencas')
    .insert({ sessao_id: s.id, atleta_id: atletaId, status: 'presente', duracao_individual_min: s.sessao.duracao_min })
    .select('*, atletas(id, nome, apelido)').single();

  if (resp.error){ toast('Não deu pra adicionar: ' + resp.error.message, 'err'); return; }

  s.presencas.push({ ...resp.data, pse: null });
  s.presencas.sort((a,b) => (a.atletas?.nome || '').localeCompare(b.atletas?.nome || ''));
  render();
}

async function salvarBateria(ev){
  ev.preventDefault();
  sincronizarBateriaDoDom();
  const f = state.testeBateriaForm;

  if (!f.teste_id){ toast('Escolha o teste.', 'err'); return; }
  if (!f.data){ toast('Escolha a data.', 'err'); return; }

  const linhas = Object.entries(f.valores)
    .filter(([, v]) => v !== '' && v != null)
    .map(([atletaId, v]) => ({
      teste_id: Number(f.teste_id),
      atleta_id: atletaId,
      data: f.data,
      bateria: f.bateria || null,
      valor: Number(String(v).replace(',', '.')),
      condicoes: f.condicoes || null,
      avaliador: f.avaliador || null,
    }));

  if (linhas.length === 0){ toast('Preencha o resultado de pelo menos um atleta.', 'err'); return; }
  const invalidas = linhas.filter(l => Number.isNaN(l.valor));
  if (invalidas.length){ toast('Tem resultado inválido em algum atleta — confira os números.', 'err'); return; }

  const btn = document.getElementById('btn-salvar-bateria');
  if (btn){ btn.disabled = true; btn.textContent = 'Salvando…'; }

  // upsert: rodar a mesma bateria de novo na mesma data corrige em vez de duplicar
  const resp = await sb.from('resultados_testes').upsert(linhas, { onConflict: 'teste_id,atleta_id,data' }).select();

  if (resp.error){
    toast('Não foi possível salvar: ' + resp.error.message, 'err');
    if (btn){ btn.disabled = false; btn.textContent = 'Salvar resultados'; }
    return;
  }

  toast(`${linhas.length} resultado${linhas.length===1?'':'s'} salvo${linhas.length===1?'':'s'}.`, 'ok');
  state.resultadosTestesCarregados = false;
  await carregarResultadosTestes();
  voltarDaBateria();
}

  // Se a migração de categorias do evento ainda não rodou no Supabase, a
  // tabela não existe — trata como "sem categorias marcadas" em vez de travar.
  const categoriaIds = new Set((categoriasResp?.data || []).map(r => r.categoria_id));

  state.eventoAtual = { carregando: false, competicao, duplas: duplas || [], jogos: jogos || [], categoriaIds };
  render();
}

// Evento em cascade (duplas/jogos/sets/rallies/resultados_competicao todos
// têm "on delete cascade" até chegar em competicoes) — uma DELETE só resolve,
// mas o aviso deixa claro tudo que some junto.
async function excluirEvento(){
  const ev = state.eventoAtual;
  if (!ev || !ev.competicao) return;
  const qtdJogos = ev.jogos?.length || 0;
  const qtdDuplas = ev.duplas?.length || 0;
  if (!confirm(
    `Excluir o evento "${ev.competicao.nome}" definitivamente?\n\n` +
    `Isso apaga também ${qtdDuplas} dupla(s) e ${qtdJogos} jogo(s) (com todos os sets e pontos marcados) registrados nele. Não pode ser desfeito.`
  )) return;

  const btn = document.getElementById('btn-excluir-evento');
  if (btn){ btn.disabled = true; btn.textContent = 'Excluindo…'; }

  const resp = await sb.from('competicoes').delete().eq('id', ev.competicao.id);
  if (resp.error){
    if (btn){ btn.disabled = false; btn.textContent = 'Excluir evento'; }
    toast('Não foi possível excluir o evento: ' + resp.error.message, 'err');
    return;
  }

  state.competicoes = state.competicoes.filter(c => c.id !== ev.competicao.id);
  toast('Evento excluído.', 'ok');
  voltarParaEventos();
}

// Jogo em cascade (sets/rallies somem junto) — pra corrigir um jogo criado
// errado sem precisar mexer no evento inteiro.
async function excluirJogo(jogoId, ev){
  if (ev) ev.stopPropagation(); // o card do jogo tem onclick pra abrir o scout — não deixa isso disparar
  const jogo = state.eventoAtual?.jogos?.find(j => j.id === jogoId);
  const nomesAdv = jogo ? [jogo.adversarios?.atleta_1_nome, jogo.adversarios?.atleta_2_nome].filter(Boolean).join(' / ') : '';
  if (!confirm(`Excluir este jogo${nomesAdv ? ' (vs ' + nomesAdv + ')' : ''} definitivamente?\n\nIsso apaga os sets e os pontos marcados dele. Não pode ser desfeito.`)) return;

  const resp = await sb.from('jogos').delete().eq('id', jogoId);
  if (resp.error){ toast('Não foi possível excluir o jogo: ' + resp.error.message, 'err'); return; }

  if (state.eventoAtual) state.eventoAtual.jogos = state.eventoAtual.jogos.filter(j => j.id !== jogoId);
  try { // evita reabrir do cache offline um jogo que acabou de ser excluído
    const raw = localStorage.getItem('ft_scout_offline');
    if (raw && JSON.parse(raw).jogoId === jogoId) localStorage.removeItem('ft_scout_offline');
  } catch {}
  toast('Jogo excluído.', 'ok');
  render();
}

// Nome de exibição de uma dupla: nomes dos dois, usando o parceiro externo
// (texto livre) quando não é atleta do nosso CT.
function nomeDupla(d){
  if (!d) return 'Dupla';
  const a1 = state.atletas.find(a => a.id === d.atleta_1_id);
  const nome2 = d.atleta_2_id
    ? (state.atletas.find(a => a.id === d.atleta_2_id)?.apelido || state.atletas.find(a => a.id === d.atleta_2_id)?.nome)
    : d.parceiro_externo_nome;
  return [a1?.apelido || a1?.nome, nome2].filter(Boolean).join(' / ') || 'Dupla';
}

// Agrupa uma lista (duplas, jogos...) pela categoria da dupla, na ordem das
// categorias cadastradas, com um grupo "Sem categoria" no fim pra quem não tem.
function agruparPorCategoria(items, categoriaIdDoItem){
  const porId = new Map();
  items.forEach(item => {
    const catId = categoriaIdDoItem(item);
    if (!porId.has(catId)) porId.set(catId, []);
    porId.get(catId).push(item);
  });
  const grupos = [...porId.entries()]
    .map(([catId, itens]) => ({ categoria: state.categorias.find(c => c.id === catId) || null, itens }))
    .sort((a, b) => {
      if (!a.categoria) return 1;
      if (!b.categoria) return -1;
      return (a.categoria.ordem ?? 0) - (b.categoria.ordem ?? 0);
    });
  return grupos;
}

async function abrirScout(jogoId){
  state.view = 'jogo-scout';

  // Se esse jogo já foi aberto antes neste aparelho, o estado local é sempre
  // igual ou mais atualizado que o servidor (a fila de sincronização garante
  // isso) — então retoma dali direto, sem precisar de sinal.
  const persistido = carregarJogoAtualOffline(jogoId);
  if (persistido){
    state.jogoAtual = { ...persistido, salvando: false };
    render();
    if (!state.subtipos) carregarSubtipos().then(render).catch(() => {});
    processarFilaSync();
    return;
  }

  state.jogoAtual = { carregando: true };
  render();

  if (!state.subtipos) await carregarSubtipos();

  const [{ data: jogo, error: e1 }, { data: sets, error: e2 }] = await Promise.all([
    sb.from('jogos').select('*, duplas(id, atleta_1_id, atleta_2_id, parceiro_externo_nome), adversarios(*), competicoes(nome, nivel)').eq('id', jogoId).single(),
    sb.from('sets').select('*').eq('jogo_id', jogoId).order('numero'),
  ]);
  if (e1 || e2){
    toast('Sem conexão pra abrir esse jogo pela primeira vez neste aparelho — tenta de novo com sinal.', 'err');
    voltarParaEvento();
    return;
  }

  const setAtual = sets[sets.length - 1];
  const { data: rallies, error: e3 } = await sb.from('rallies').select('*').eq('set_id', setAtual.id).order('numero');
  if (e3){ toast('Erro ao carregar os pontos: ' + e3.message, 'err'); return; }

  state.jogoAtual = {
    carregando: false,
    jogo, sets, setAtualId: setAtual.id, rallies: rallies || [],
    passo: null, acaoEscolhida: null, salvando: false, avisoSet: null,
    finalizado: jogo.sets_pro === (jogo.sets_para_vencer || 2) || jogo.sets_contra === (jogo.sets_para_vencer || 2),
  };
  persistirJogoAtualOffline();
  render();
}

// Fundamentos com detalhe (direção/tipo/o-que-errou). Pra estes, depois de
// escolher quem fez a ação a gente ainda pergunta o detalhe antes de gravar.
// Erro do adversário e Outro não têm detalhe — gravam na hora.
const ORIGENS_COM_DETALHE = ['ataque', 'saque', 'bloqueio', 'erro_nosso'];

function escolherLado(lado){
  state.jogoAtual.passo = lado;
  state.jogoAtual.acaoEscolhida = null;
  render();
}

function cancelarPasso(){
  state.jogoAtual.passo = null;
  state.jogoAtual.acaoEscolhida = null;
  render();
}

// Passo intermediário: se o fundamento tem detalhe (ataque/saque/bloqueio/erro
// nosso), mostra os botões de detalhe (paralela, flutuado, erro de passe...).
// Senão grava direto. adversarioNum = qual dos dois adversários (1 ou 2),
// só usado quando o ponto foi deles por ação boa deles.
function escolherAcao(ladoVencedor, origem, atletaId, adversarioNum){
  if (!ORIGENS_COM_DETALHE.includes(origem)){
    registrarPonto(ladoVencedor, origem, atletaId, null, adversarioNum || null);
    return;
  }
  state.jogoAtual.acaoEscolhida = { ladoVencedor, origem, atletaId, adversarioNum: adversarioNum || null };
  render();
}

function cancelarAcao(){
  state.jogoAtual.acaoEscolhida = null;
  render();
}

// O time que ganha o rally saca o próximo — vale desde a primeira bola do set
// (que alterna a cada set novo, começando com o nosso saque no set 1).
function sacadorLadoParaProximaRally(){
  const ja = state.jogoAtual;
  if (ja.rallies.length === 0){
    const indiceSet = ja.sets.findIndex(s => s.id === ja.setAtualId);
    return indiceSet % 2 === 0 ? 'nos' : 'eles';
  }
  return ja.rallies[ja.rallies.length - 1].ponto_para;
}

// Grava local primeiro, sempre — o jogo nunca espera a rede pra continuar.
// A tentativa de sincronizar com o Supabase acontece "por trás", sem travar
// a próxima jogada.
function registrarPonto(ladoVencedor, origem, atletaId, subtipoId, adversarioNum){
  const ja = state.jogoAtual;
  if (ja.salvando) return;
  ja.salvando = true;

  const ultimo = ja.rallies[ja.rallies.length - 1];
  const proPro = ultimo ? ultimo.placar_pro : 0;
  const proContra = ultimo ? ultimo.placar_contra : 0;
  const novoPro = ladoVencedor === 'nos' ? proPro + 1 : proPro;
  const novoContra = ladoVencedor === 'eles' ? proContra + 1 : proContra;
  const sacadorLado = sacadorLadoParaProximaRally();

  const novaRally = {
    id: novoUuid(),
    set_id: ja.setAtualId,
    numero: ja.rallies.length + 1,
    ponto_para: ladoVencedor,
    origem,
    atleta_id: atletaId || null,
    subtipo_id: subtipoId || null,
    adversario_num: adversarioNum || null,
    sacador_lado: sacadorLado,
    sacador_atleta_id: null,
    placar_pro: novoPro,
    placar_contra: novoContra,
  };
  ja.rallies.push(novaRally);
  ja.passo = null;
  ja.acaoEscolhida = null;
  ja.salvando = false;

  const setAtual = ja.sets.find(s => s.id === ja.setAtualId);
  setAtual.pontos_pro = novoPro;
  setAtual.pontos_contra = novoContra;

  enfileirarOperacao('rallies', 'insert', novaRally.id, novaRally);
  enfileirarOperacao('sets', 'update', ja.setAtualId, { pontos_pro: novoPro, pontos_contra: novoContra });

  checarFimDeSet();
  persistirJogoAtualOffline();
  render();
  processarFilaSync();
}

function checarFimDeSet(){
  const ja = state.jogoAtual;
  const setAtual = ja.sets.find(s => s.id === ja.setAtualId);
  const setsParaVencer = ja.jogo.sets_para_vencer || 2;
  // "decisivo" só existe em jogo de melhor de 3 (sets_para_vencer=2): é o 3º set,
  // o que desempata. Em melhor de 1 nunca tem decisivo — o único set já usa o
  // limite normal de pontos.
  const decisivo = setsParaVencer === 2 && ja.sets.length === 3;
  const limite = decisivo ? (ja.jogo.pontos_set_decisivo || 15) : (ja.jogo.pontos_set || 21);
  const p = setAtual.pontos_pro, c = setAtual.pontos_contra;
  const acabou = (p >= limite || c >= limite) && Math.abs(p - c) >= 2;
  if (!acabou) return;

  const nosGanhamos = p > c;
  ja.jogo.sets_pro    += nosGanhamos ? 1 : 0;
  ja.jogo.sets_contra += nosGanhamos ? 0 : 1;
  enfileirarOperacao('jogos', 'update', ja.jogo.id, { sets_pro: ja.jogo.sets_pro, sets_contra: ja.jogo.sets_contra });

  if (ja.jogo.sets_pro === setsParaVencer || ja.jogo.sets_contra === setsParaVencer){
    ja.finalizado = true;
    ja.avisoSet = {
      tipo: 'jogo', numeroSetEncerrado: setAtual.numero, pontosPro: p, pontosContra: c,
      setsPro: ja.jogo.sets_pro, setsContra: ja.jogo.sets_contra,
    };
    return;
  }

  const novoSet = {
    id: novoUuid(), jogo_id: ja.jogo.id, numero: setAtual.numero + 1,
    lado_inicial: setAtual.lado_inicial === 'A' ? 'B' : 'A', pontos_pro: 0, pontos_contra: 0,
  };
  enfileirarOperacao('sets', 'insert', novoSet.id, novoSet);

  ja.sets.push(novoSet);
  ja.setAtualId = novoSet.id;
  ja.rallies = [];
  ja.avisoSet = {
    tipo: 'set', numeroSetEncerrado: setAtual.numero, pontosPro: p, pontosContra: c,
    proximoSetNumero: novoSet.numero,
  };
}

function confirmarAvisoSet(){

function desfazerUltimoPonto(){
  const ja = state.jogoAtual;
  if (!ja.rallies.length) return;
  if (!confirm('Desfazer o último ponto marcado?')) return;

  const ultimo = ja.rallies.pop();
  enfileirarOperacao('rallies', 'delete', ultimo.id, null);

  const anterior = ja.rallies[ja.rallies.length - 1];
  const novoPro = anterior ? anterior.placar_pro : 0;
  const novoContra = anterior ? anterior.placar_contra : 0;
  const setAtual = ja.sets.find(s => s.id === ja.setAtualId);
  setAtual.pontos_pro = novoPro;
  setAtual.pontos_contra = novoContra;
  enfileirarOperacao('sets', 'update', ja.setAtualId, { pontos_pro: novoPro, pontos_contra: novoContra });

  toast('Ponto desfeito.', 'ok');
  persistirJogoAtualOffline();
  render();
  processarFilaSync();
}

/* ---------------------------- estatísticas ---------------------------- */

// Todos os pontos com atleta marcado (nossos fundamentos + nossos erros) e
// todos os jogos (com a dupla embutida, pra saber quem jogou). É pouco
// volume de dados pra comissão técnica de uma equipe, então dá pra trazer
// tudo de uma vez e agregar aqui na tela — sem precisar de view nova no banco.
async function carregarEstatisticas(){
  const [{ data: rallies, error: e1 }, { data: jogos, error: e2 }] = await Promise.all([
    sb.from('rallies')
      .select('*, subtipos_acao(codigo, nome), sets(numero, jogo_id)')
      .not('atleta_id', 'is', null),
    sb.from('jogos')
      .select('*, duplas(atleta_1_id, atleta_2_id), competicoes(nome)')
      .order('criado_em', { ascending: true }),
  ]);
  if (e1 || e2){ toast('Erro ao carregar estatísticas: ' + (e1 || e2).message, 'err'); return; }
  state.estatisticas = { rallies: rallies || [], jogos: jogos || [] };
  state.estatisticasCarregadas = true;
}

const FUNDAMENTOS = ['ataque', 'saque', 'bloqueio'];

function jogoPorId(jogoId){
  return state.estatisticas.jogos.find(j => j.id === jogoId);
}

function ralliesDoAtleta(atletaId){
  return state.estatisticas.rallies.filter(r => r.atleta_id === atletaId);
}

// Ganhos = pontos que o atleta fechou (ataque/saque/bloqueio). Erros = pontos
// perdidos por erro dele, já classificados por tipo (erro_nosso.subtipo).
function statsFundamento(atletaId){
  const out = {};
  FUNDAMENTOS.forEach(f => { out[f] = { ganhos: 0, erros: 0 }; });
  ralliesDoAtleta(atletaId).forEach(r => {
    if (FUNDAMENTOS.includes(r.origem)) out[r.origem].ganhos++;
    else if (r.origem === 'erro_nosso' && r.subtipos_acao && FUNDAMENTOS.includes(r.subtipos_acao.codigo)){
      out[r.subtipos_acao.codigo].erros++;
    }
  });
  return out;
}

function aproveitamento(ganhos, erros){
  const total = ganhos + erros;
  return total === 0 ? null : Math.round((ganhos / total) * 100);
}

function errosMaisComuns(atletaId){
  const contagem = {};
  ralliesDoAtleta(atletaId).filter(r => r.origem === 'erro_nosso').forEach(r => {
    const nome = r.subtipos_acao?.nome || 'Outro';
    contagem[nome] = (contagem[nome] || 0) + 1;
  });
  return Object.entries(contagem).sort((a, b) => b[1] - a[1]);
}

// Detalhe de saque: quebra os pontos ganhos de saque (ace) por tipo — viagem,
// flutuado, parado — igual já existia pros erros, só que pro lado positivo.
// Erro de saque entra separado, porque no scout ele é um "erro_nosso" com
// subtipo "saque", não um "saque" que perdeu o ponto.
function saqueDetalhado(atletaId){
  const acesPorTipo = {};
  let erros = 0;
  ralliesDoAtleta(atletaId).forEach(r => {
    if (r.origem === 'saque'){
      const nome = r.subtipos_acao?.nome || 'Geral';
      acesPorTipo[nome] = (acesPorTipo[nome] || 0) + 1;
    } else if (r.origem === 'erro_nosso' && r.subtipos_acao?.codigo === 'saque'){
      erros++;
    }
  });
  const aces = Object.entries(acesPorTipo).sort((a, b) => b[1] - a[1]);
  const totalAces = aces.reduce((s, [, qtd]) => s + qtd, 0);
  return { aces, erros, totalAces, aproveitamento: aproveitamento(totalAces, erros) };
}

function evolucaoTemporal(atletaId){
  const porJogo = {};
  ralliesDoAtleta(atletaId).forEach(r => {
    const jogoId = r.sets?.jogo_id;
    if (!jogoId) return;
    if (!porJogo[jogoId]) porJogo[jogoId] = { ganhos: 0, erros: 0 };
    if (FUNDAMENTOS.includes(r.origem)) porJogo[jogoId].ganhos++;
    else if (r.origem === 'erro_nosso') porJogo[jogoId].erros++;
  });
  return Object.entries(porJogo)
    .map(([jogoId, v]) => ({ jogo: jogoPorId(jogoId), ...v, aproveitamento: aproveitamento(v.ganhos, v.erros) }))
    .filter(x => x.jogo)
    .sort((a, b) => new Date(a.jogo.criado_em) - new Date(b.jogo.criado_em));
}

function jogosDoAtleta(atletaId){
  return state.estatisticas.jogos
    .filter(j => j.duplas && (j.duplas.atleta_1_id === atletaId || j.duplas.atleta_2_id === atletaId))
    .sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));
}

// filtroIds vazio (ou não informado) = todo mundo, igual sempre foi. Quando
// tem gente marcada no filtro, restringe a comparação só a esse grupo — pra
// não precisar rolar os 50+ atletas quando só interessa comparar um time.
function comparacaoAtletas(filtroIds){
  const base = (filtroIds && filtroIds.size > 0) ? state.atletas.filter(a => filtroIds.has(a.id)) : state.atletas;
  return base.map(a => {
    const st = statsFundamento(a.id);
    const ganhos = FUNDAMENTOS.reduce((s, f) => s + st[f].ganhos, 0);
    const erros = FUNDAMENTOS.reduce((s, f) => s + st[f].erros, 0);
    return { atleta: a, ganhos, erros, aproveitamento: aproveitamento(ganhos, erros) };
  })
  .filter(x => x.aproveitamento !== null)
  .sort((a, b) => b.aproveitamento - a.aproveitamento);
}

function atletasFiltrados(){

  return state.atletas.filter(a => {
    if (state.filtro.status && a.status !== state.filtro.status) return false;
    if (state.filtro.categoria && String(a.categoria_id) !== state.filtro.categoria) return false;
    if (state.filtro.turma && !(state.turmaAtletasMap[a.id] || []).map(String).includes(state.filtro.turma)) return false;
    if (busca && !(a.nome || '').toLowerCase().includes(busca) &&
                 !(a.apelido || '').toLowerCase().includes(busca)) return false;
    return true;
  });
}

  state.atletas.forEach(a => { c[a.status] = (c[a.status] || 0) + 1; });

}

function renderPreviaImportacao(imp){
  const validas = imp.linhas.filter(l => l.erros.length === 0 && l.incluir);
  const comErro = imp.linhas.filter(l => l.erros.length > 0);
  const comAviso = imp.linhas.filter(l => l.erros.length === 0 && l.avisos.length > 0);

  return `
    <div class="section-title" style="margin-top:24px">3. Confira e importe</div>
    <p class="muted" style="margin-top:-4px">
      ${imp.linhas.length} linha${imp.linhas.length===1?'':'s'} encontrada${imp.linhas.length===1?'':'s'} ·
      ${validas.length} pronta${validas.length===1?'':'s'} pra importar
      ${comErro.length ? ` · ${comErro.length} com erro (não ${comErro.length===1?'vai':'vão'} ser importada${comErro.length===1?'':'s'})` : ''}
      ${comAviso.length ? ` · ${comAviso.length} com aviso` : ''}
    </p>

    <div style="overflow-x:auto">
      <table>
        <thead><tr><th></th><th>Nome</th><th>Sexo</th><th>Categoria</th><th>Status</th><th>Observações da importação</th></tr></thead>
        <tbody>
          ${imp.linhas.map((l, i) => {
            const cat = state.categorias.find(c => c.id === l.dados.categoria_id);
            const temErro = l.erros.length > 0;
            return `
              <tr class="row" style="cursor:default;${temErro ? 'opacity:.6' : ''}">
                <td><input type="checkbox" class="checkbox-big" ${l.incluir?'checked':''} ${temErro?'disabled':''}
                       onchange="toggleIncluirLinhaImportacao(${i})"></td>
                <td class="nome-cel">${escapeHtml(l.dados.nome || '(sem nome)')}</td>
                <td>${escapeHtml(l.dados.sexo || '—')}</td>
                <td>${cat ? escapeHtml(cat.nome) : '—'}</td>
                <td>${escapeHtml(l.dados.status)}</td>
                <td>
                  ${l.erros.map(e => `<div style="color:var(--d);font-size:.78rem">${escapeHtml(e)}</div>`).join('')}
                  ${l.avisos.map(a => `<div style="color:var(--b);font-size:.78rem">${escapeHtml(a)}</div>`).join('')}
                  ${!temErro && l.avisos.length===0 ? `<span class="muted" style="font-size:.78rem">tudo certo</span>` : ''}
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="ficha-actions">
      <button type="button" id="btn-confirmar-importacao" class="btn btn-primary" onclick="confirmarImportacaoAtletas()" ${validas.length===0?'disabled':''}>
        Importar ${validas.length} atleta${validas.length===1?'':'s'}
      </button>
      <button type="button" class="btn btn-ghost" onclick="limparImportacao()">Escolher outro arquivo</button>
    </div>`;
}

function renderEventoDetalhe(){

            <span class="pill">${j.sets_pro} × ${j.sets_contra}</span>
          </div>
          <div class="meta">
            ${labelFase(j.fase)}

        </div>
        <button type="button" class="btn btn-ghost btn-sm" style="color:var(--d)" onclick="excluirJogo('${j.id}', event)" title="Excluir jogo">Excluir</button>

  };

  app.innerHTML = `
    ${renderTopbar()}
    <div class="main">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <button class="btn btn-ghost btn-sm" onclick="voltarParaEventos()">← Voltar</button>
        <button id="btn-excluir-evento" type="button" class="btn btn-ghost btn-sm" style="color:var(--d)" onclick="excluirEvento()">Excluir evento</button>
      </div>
      <h1>${escapeHtml(c.nome)}</h1>
      <p class="muted" style="margin-bottom:20px">
        ${escapeHtml(c.nivel)} · ${new Date(c.data_inicio+'T00:00:00').toLocaleDateString('pt-BR')}${c.data_fim && c.data_fim !== c.data_inicio ? ' a ' + new Date(c.data_fim+'T00:00:00').toLocaleDateString('pt-BR') : ''}
        ${c.cidade ? ' · ' + escapeHtml(c.cidade) + (c.uf ? '/' + escapeHtml(c.uf) : '') : ''}

        gruposJogos.map(g => `
          <div style="margin-bottom:20px">
