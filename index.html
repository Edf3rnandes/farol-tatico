    </div>`;
}

/* ---------------------------- render: estatísticas ---------------------------- */

function renderEstatisticas(){
  if (!state.estatisticasCarregadas){
    app.innerHTML = `${renderTopbar()}<div class="center-screen"><div class="spinner"></div></div>`;
    return;
  }

  const atletaId = state.statsAtletaId;
  const atletasOrdenados = [...state.atletas].sort((a,b) => (a.nome||'').localeCompare(b.nome||''));

  app.innerHTML = `
    ${renderTopbar()}
    <div class="main">
      <h1>Estatísticas</h1>
      <p class="muted" style="margin-bottom:18px">Calculado a partir dos pontos marcados no scout ao vivo.</p>

      <div class="field" style="max-width:320px">
        <label>Atleta</label>
        <select onchange="selecionarAtletaEstatisticas(this.value)">
          <option value="">Comparação entre todos</option>
          ${atletasOrdenados.map(a => `<option value="${a.id}" ${atletaId===a.id?'selected':''}>${escapeHtml(a.nome)}</option>`).join('')}
        </select>
      </div>

      ${atletaId ? renderStatsAtleta(atletaId) : renderStatsComparacao()}
    </div>`;
}

function barraAproveitamento(pct){
  if (pct === null) return '<span class="muted">—</span>';
  const cor = pct >= 60 ? 'var(--c)' : pct >= 40 ? 'var(--b)' : 'var(--d)';
  return `
    <div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;max-width:120px;height:8px;border-radius:4px;background:var(--card2);overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${cor}"></div>
      </div>
      <span style="font-weight:700;font-size:.82rem">${pct}%</span>
    </div>`;
}

function renderStatsComparacao(){
  const ranking = comparacaoAtletas();
  if (ranking.length === 0){
    return `<div class="empty" style="margin-top:20px">Ainda não há pontos suficientes marcados no scout pra gerar uma comparação.</div>`;
  }
  return `
    <div class="section-title" style="margin-top:22px">Aproveitamento geral (ataque + saque + bloqueio vs. erro nosso)</div>
    <table>
      <thead><tr><th>Atleta</th><th>Aproveitamento</th><th>Ganhos</th><th>Erros</th></tr></thead>
      <tbody>
        ${ranking.map(r => `
          <tr class="row" onclick="selecionarAtletaEstatisticas('${r.atleta.id}')">
            <td class="nome-cel">${escapeHtml(r.atleta.apelido || r.atleta.nome)}</td>
            <td>${barraAproveitamento(r.aproveitamento)}</td>
            <td>${r.ganhos}</td>
            <td>${r.erros}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function renderStatsAtleta(atletaId){
  const atleta = state.atletas.find(a => a.id === atletaId);
  const st = statsFundamento(atletaId);
  const erros = errosMaisComuns(atletaId);
  const evolucao = evolucaoTemporal(atletaId);
  const jogos = jogosDoAtleta(atletaId);

  return `
    <h2 style="margin-top:22px">${escapeHtml(atleta?.apelido || atleta?.nome || 'Atleta')}</h2>

    <div class="section-title" style="margin-top:18px">Eficiência por fundamento</div>
    <div class="row3">
      ${FUNDAMENTOS.map(f => {
        const pct = aproveitamento(st[f].ganhos, st[f].erros);
        return `
          <div class="card">
            <div class="section-title" style="margin-bottom:8px">${f[0].toUpperCase()+f.slice(1)}</div>
            <div style="font-size:1.6rem;font-weight:800">${pct===null?'—':pct+'%'}</div>
            <div class="muted" style="margin:4px 0 0">${st[f].ganhos} ponto${st[f].ganhos===1?'':'s'} · ${st[f].erros} erro${st[f].erros===1?'':'s'}</div>
          </div>`;
      }).join('')}
    </div>

    <div class="section-title" style="margin-top:24px">Evolução ao longo dos jogos</div>
    ${evolucao.length === 0 ? `<div class="empty">Ainda sem jogos com pontos marcados no scout pra este atleta.</div>` : `
      <div class="card" style="display:flex;align-items:flex-end;gap:6px;height:90px;overflow-x:auto;padding:16px">
        ${evolucao.map(e => {
          const pct = e.aproveitamento ?? 0;
          const cor = pct >= 60 ? 'var(--c)' : pct >= 40 ? 'var(--b)' : 'var(--d)';
          const data = e.jogo.criado_em ? new Date(e.jogo.criado_em).toLocaleDateString('pt-BR') : '';
          const tooltip = `${e.jogo.competicoes?.nome || 'Jogo'} · ${data} · ${e.aproveitamento===null?'sem dados':e.aproveitamento+'%'}`;
          return `<div title="${escapeHtml(tooltip)}" style="width:14px;height:${Math.max(6, pct)}px;border-radius:3px;background:${cor};flex:none"></div>`;
        }).join('')}
      </div>
      <p class="muted" style="margin-top:6px">Cada barra é um jogo, do mais antigo (esquerda) ao mais recente (direita). Passe o mouse pra ver os detalhes.</p>
    `}

    <div class="section-title" style="margin-top:24px">Erros mais comuns</div>
    ${erros.length === 0 ? `<div class="empty">Nenhum erro registrado ainda pra este atleta.</div>` : `
      <div class="card" style="padding:6px 16px">
        ${erros.map(([nome, qtd]) => `
          <div class="presenca-row"><span class="nome">${escapeHtml(nome)}</span><span class="pill">${qtd}</span></div>
        `).join('')}
      </div>`}

    <div class="section-title" style="margin-top:24px">Jogos (${jogos.length})</div>
    ${jogos.length === 0 ? `<div class="empty">Nenhum jogo registrado ainda.</div>` : jogos.map(j => {
      const finalizado = j.sets_pro === 2 || j.sets_contra === 2;
      const venceu = j.sets_pro > j.sets_contra;
      return `
        <div class="list-item" style="cursor:default">
          <div class="top">
            <div class="titulo">${escapeHtml(j.competicoes?.nome || 'Evento')} · ${labelFase(j.fase)}</div>
            <span class="pill" style="${finalizado ? (venceu ? 'background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)' : 'background:color-mix(in srgb,var(--d) 18%,transparent);color:var(--d)') : ''}">
              ${j.sets_pro} × ${j.sets_contra}${finalizado ? (venceu ? ' · V' : ' · D') : ''}
            </span>
          </div>
          <div class="meta">${j.criado_em ? new Date(j.criado_em).toLocaleDateString('pt-BR') : ''}</div>
        </div>`;
    }).join('')}
  `;
}

// Resumo compacto embutido na ficha do atleta — reaproveita as mesmas
// funções de agregação da tela de Estatísticas completa.
function renderResumoDesempenho(atletaId){
  const st = statsFundamento(atletaId);
  const jogos = jogosDoAtleta(atletaId);
  const vitorias = jogos.filter(j => (j.sets_pro===2||j.sets_contra===2) && j.sets_pro > j.sets_contra).length;
  const derrotas = jogos.filter(j => (j.sets_pro===2||j.sets_contra===2) && j.sets_contra > j.sets_pro).length;
  const semPontos = FUNDAMENTOS.every(f => st[f].ganhos + st[f].erros === 0);

  if (semPontos && jogos.length === 0){
    return `<p class="muted" style="margin-top:-4px">Nenhum ponto marcado no scout ainda pra este atleta.</p>`;
  }

  return `
    <div class="row3" style="margin-bottom:10px">
      ${FUNDAMENTOS.map(f => {
        const pct = aproveitamento(st[f].ganhos, st[f].erros);
        return `<div><div class="muted" style="margin-bottom:2px">${f[0].toUpperCase()+f.slice(1)}</div><div style="font-weight:700">${pct===null?'—':pct+'%'}</div></div>`;
      }).join('')}
    </div>
    <p class="muted" style="margin:0 0 10px">${jogos.length} jogo${jogos.length===1?'':'s'} · ${vitorias}V ${derrotas}D</p>
    <button type="button" class="btn btn-sm" onclick="verEstatisticasDoAtleta('${atletaId}')">Ver estatísticas completas</button>
  `;
}

function renderTimelineRallies(ja){
  const subtiposPorOrigem = (origem) => (state.subtipos || []).filter(s => s.origem === origem);
  return `
    <div class="section-title" style="margin-top:22px">Linha do set (${ja.rallies.length} ponto${ja.rallies.length===1?'':'s'})</div>
    ${ja.rallies.length === 0 ? `<div class="empty">Nenhum ponto marcado ainda neste set.</div>` :
      [...ja.rallies].reverse().map(r => {
        const opcoes = subtiposPorOrigem(r.origem);
        return `
          <div class="list-item" style="cursor:default">
            <div class="top">
              <div class="titulo">${r.numero}. ${r.ponto_para==='nos'?'Nós':'Eles'} ${r.placar_pro}-${r.placar_contra}</div>
              <span class="pill">${labelOrigem(r.origem)}</span>
            </div>
            <div class="meta" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              ${r.atleta_id ? `<span>${escapeHtml(nomeAtletaCurto(r.atleta_id))}</span>` : ''}
              ${r.adversario_num ? `<span>${escapeHtml(nomeAdversario(ja, r.adversario_num))}</span>` : ''}
              ${opcoes.length ? `
                <select onchange="definirSubtipoRally('${r.id}', this.value)"
                        style="background:var(--card);border:1px solid var(--line);color:var(--tx2);
                               border-radius:7px;padding:4px 8px;font-size:.76rem">
                  <option value="">Detalhe…</option>
                  ${opcoes.map(s => `<option value="${s.id}" ${r.subtipo_id===s.id?'selected':''}>${escapeHtml(s.nome)}</option>`).join('')}
                </select>
              ` : ''}
            </div>
          </div>`;
      }).join('')}`;
}

function renderScout(){
  const ja = state.jogoAtual;
  if (ja.carregando){
    app.innerHTML = `${renderTopbar()}<div class="center-screen"><div class="spinner"></div></div>`;
    return;
  }

  const [atleta1, atleta2] = atletasDaDupla(ja);
  const setAtual = ja.sets.find(s => s.id === ja.setAtualId);
  const nomesAdv = [ja.jogo.adversarios?.atleta_1_nome, ja.jogo.adversarios?.atleta_2_nome].filter(Boolean).join(' / ');

  app.innerHTML = `
    ${renderTopbar()}
    <div class="main">
      <button class="btn btn-ghost btn-sm" style="margin-bottom:14px" onclick="voltarParaEvento()">← Voltar</button>

      <h1>${escapeHtml(atleta1.apelido || atleta1.nome)} / ${escapeHtml(atleta2.apelido || atleta2.nome)}</h1>
      <p class="muted" style="margin-bottom:16px">
        vs ${escapeHtml(nomesAdv || 'adversário')}
        ${ja.jogo.competicoes ? ' · ' + escapeHtml(ja.jogo.competicoes.nome) : ''} · ${labelFase(ja.jogo.fase)}
      </p>

      <div class="card" style="text-align:center;margin-bottom:16px">
        <div class="muted" style="margin-bottom:2px">Sets: ${ja.jogo.sets_pro} × ${ja.jogo.sets_contra} — Set ${setAtual.numero}</div>
        <div class="placar-set">${setAtual.pontos_pro} <span style="color:var(--tx3);font-size:1.6rem">×</span> ${setAtual.pontos_contra}</div>
      </div>

      ${state.filaSync.length > 0 ? `
        <div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:10px;border-color:var(--b)">
          <span style="flex:1;color:var(--b);font-weight:700;font-size:.85rem">
            ${state.sincronizando ? 'Sincronizando…' :
              `${state.filaSync.length} atualiza${state.filaSync.length===1?'ção':'ções'} salva${state.filaSync.length===1?'':'s'} neste aparelho, sem sinal pra sincronizar ainda`}
          </span>
          <button type="button" class="btn btn-sm" onclick="processarFilaSync()" ${state.sincronizando?'disabled':''}>Sincronizar agora</button>
        </div>
      ` : ''}

      ${ja.avisoSet ? `
        <div class="card" style="text-align:center;margin-bottom:16px;border-color:var(--a)">
          <h2 style="margin-bottom:6px">${ja.avisoSet.tipo === 'jogo' ? 'Jogo encerrado!' : `Set ${ja.avisoSet.numeroSetEncerrado} encerrado`}</h2>
          <p class="muted" style="margin-bottom:14px">
            Resultado do set: ${ja.avisoSet.pontosPro} × ${ja.avisoSet.pontosContra}
            ${ja.avisoSet.tipo === 'jogo' ? `<br>Placar final: ${ja.avisoSet.setsPro} × ${ja.avisoSet.setsContra} sets` : ''}
          </p>
          <button type="button" class="btn btn-primary" onclick="confirmarAvisoSet()">
            ${ja.avisoSet.tipo === 'jogo' ? 'Ok' : `Começar o Set ${ja.avisoSet.proximoSetNumero}`}
          </button>
        </div>
      ` : ja.finalizado ? `
        <div class="card" style="text-align:center;margin-bottom:16px">
          <div class="ok-check" style="justify-content:center;display:flex">Jogo encerrado.</div>
        </div>
      ` : `
        ${ja.passo === null ? `
          <div class="scout-lado">
            <button type="button" class="scout-lado-btn nos" onclick="escolherLado('nos')" ${ja.salvando?'disabled':''}>PONTO NOSSO</button>
            <button type="button" class="scout-lado-btn eles" onclick="escolherLado('eles')" ${ja.salvando?'disabled':''}>PONTO DELES</button>
          </div>
        ` : ja.acaoEscolhida === null ? `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <p class="muted" style="margin:0;flex:1">${ja.passo==='nos' ? 'Ponto nosso — como?' : 'Ponto deles — como?'}</p>
            <button type="button" class="btn btn-ghost btn-sm" onclick="cancelarPasso()">Cancelar</button>
          </div>
          <div class="scout-grid">
            ${ja.passo === 'nos' ? `
              ${[atleta1, atleta2].map(at => `
                <button type="button" class="scout-btn" onclick="escolherAcao('nos','ataque','${at.id}')" ${ja.salvando?'disabled':''}>Ataque<br><span>${escapeHtml(at.apelido || at.nome)}</span></button>
                <button type="button" class="scout-btn" onclick="escolherAcao('nos','saque','${at.id}')" ${ja.salvando?'disabled':''}>Saque<br><span>${escapeHtml(at.apelido || at.nome)}</span></button>
                <button type="button" class="scout-btn" onclick="escolherAcao('nos','bloqueio','${at.id}')" ${ja.salvando?'disabled':''}>Bloqueio<br><span>${escapeHtml(at.apelido || at.nome)}</span></button>
              `).join('')}
              <button type="button" class="scout-btn" onclick="escolherAcao('nos','erro_adversario', null)" ${ja.salvando?'disabled':''}>Erro do<br><span>adversário</span></button>
              <button type="button" class="scout-btn" onclick="escolherAcao('nos','outro', null)" ${ja.salvando?'disabled':''}>Outro</button>
            ` : `
              ${[1, ja.jogo.adversarios?.atleta_2_nome ? 2 : null].filter(Boolean).map(num => `
                <button type="button" class="scout-btn" onclick="escolherAcao('eles','ataque', null, ${num})" ${ja.salvando?'disabled':''}>Ataque<br><span>${escapeHtml(nomeAdversario(ja, num))}</span></button>
                <button type="button" class="scout-btn" onclick="escolherAcao('eles','saque', null, ${num})" ${ja.salvando?'disabled':''}>Saque<br><span>${escapeHtml(nomeAdversario(ja, num))}</span></button>
                <button type="button" class="scout-btn" onclick="escolherAcao('eles','bloqueio', null, ${num})" ${ja.salvando?'disabled':''}>Bloqueio<br><span>${escapeHtml(nomeAdversario(ja, num))}</span></button>
              `).join('')}
              ${[atleta1, atleta2].map(at => `
                <button type="button" class="scout-btn" onclick="escolherAcao('eles','erro_nosso','${at.id}')" ${ja.salvando?'disabled':''}>Erro nosso<br><span>${escapeHtml(at.apelido || at.nome)}</span></button>
              `).join('')}
              <button type="button" class="scout-btn" onclick="escolherAcao('eles','outro', null)" ${ja.salvando?'disabled':''}>Outro</button>
            `}
          </div>
        ` : `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <p class="muted" style="margin:0;flex:1">
              ${labelOrigem(ja.acaoEscolhida.origem)}${ja.acaoEscolhida.atletaId ? ' — ' + escapeHtml(nomeAtletaCurto(ja.acaoEscolhida.atletaId)) : ''}${ja.acaoEscolhida.adversarioNum ? ' — ' + escapeHtml(nomeAdversario(ja, ja.acaoEscolhida.adversarioNum)) : ''} · qual foi o detalhe?
            </p>
            <button type="button" class="btn btn-ghost btn-sm" onclick="cancelarAcao()">Voltar</button>
          </div>
          <div class="scout-grid">
            ${(state.subtipos || []).filter(s => s.origem === ja.acaoEscolhida.origem).map(s => `
              <button type="button" class="scout-btn"
                onclick="registrarPonto('${ja.acaoEscolhida.ladoVencedor}','${ja.acaoEscolhida.origem}',${ja.acaoEscolhida.atletaId ? `'${ja.acaoEscolhida.atletaId}'` : 'null'},${s.id},${ja.acaoEscolhida.adversarioNum || 'null'})"
                ${ja.salvando?'disabled':''}>${escapeHtml(s.nome)}</button>
            `).join('')}
          </div>
        `}

        <button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="desfazerUltimoPonto()" ${ja.rallies.length===0?'disabled':''}>↩ Desfazer último ponto</button>
      `}

      ${renderTimelineRallies(ja)}
    </div>`;
}

init();
</script>
</body>
</html>
